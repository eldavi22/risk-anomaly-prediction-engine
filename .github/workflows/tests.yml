name: Risk Anomaly Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-risk-anomaly.txt
      - name: Syntax check
        run: python -m compileall -q risk_anomaly_lbfgsb.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
